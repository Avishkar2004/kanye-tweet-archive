  <template id="page-about" data-title="About — Tweet Log" data-main-class="w-full max-w-sub pt-[5vh] pb-8">

    </nav>
    <h1 class="mt-5 mb-1 text-[24px] leading-[1.3] font-medium text-ink">About</h1>

    <div class="max-w-[640px] text-[16px] leading-[1.8] text-text">
      <p class="mt-6 border-l-2 border-ink py-1 pl-[18px] text-ink">Unofficial fan project. Not affiliated with or endorsed by Kanye West or X.</p>

      <h2 class="mt-10 mb-3 text-[13px] leading-[1.4] font-normal tracking-[0.04em] text-meta uppercase">What this is</h2>
      <p class="mb-4">Tweet Log is a fan-made, text-only archive of Kanye West’s public posts on X (formerly Twitter). You can search it, filter it by date and topic, browse it as a timeline, pull a random post, and see simple statistics about when and how often posts were made.</p>
      <p class="mb-4">Layout inspired by <a href="https://yecombinator.com">yecombinator.com</a>.</p>

      <h2 class="mt-10 mb-3 text-[13px] leading-[1.4] font-normal tracking-[0.04em] text-meta uppercase">How posts are shown</h2>
      <ul class="mb-4 list-disc pl-5 marker:text-faint [&>li+li]:mt-1.5">
        <li>Each post is drawn by this site as a card, from the archive’s text. Cards are not embeds from X and load nothing from X.</li>
        <li>Times are the real posting times, in UTC. Each card’s time links to that post’s own page here.</li>
        <li>Likes and reposts appear only when the archive recorded them. Nothing is estimated.</li>
        <li>Posts that X no longer serves are marked “No longer on X”, with a link to look for them on the Wayback Machine. The rest link to the original on X.</li>
        <li>No images, video or other media from posts are reproduced. Posts that were only media are left out.</li>
        <li>Reposts of other accounts are left out.</li>
        <li>Posts appear as written. The site adds no commentary on individual posts.</li>
        <li>Topics are assigned automatically by keyword and can be wrong.</li>
      </ul>

      <h2 class="mt-10 mb-3 text-[13px] leading-[1.4] font-normal tracking-[0.04em] text-meta uppercase">Where the data comes from</h2>
      <p class="mb-4">Posts come from a public compiled archive, <a href="https://github.com/gergogyulai/yetweets">yetweets</a>, which was assembled from Internet Archive snapshots and <a href="https://polititweet.org/">PolitiTweet</a>. Nothing is scraped live. <span id="facts"></span></p>
      <p class="mb-4">Many of the original posts have since been deleted from X or are no longer served there, so most cards here say “No longer on X” and point to the Wayback Machine instead, which may or may not have a copy.</p>

      <h2 class="mt-10 mb-3 text-[13px] leading-[1.4] font-normal tracking-[0.04em] text-meta uppercase">Rights and removal</h2>
      <p class="mb-4">Post text belongs to its author. It is reproduced here for archival and commentary purposes, with a link to the original wherever X still serves it. If you hold rights to anything here and want it removed, email <a href="mailto:avishkarkakde2004@gmail.com">avishkarkakde2004@gmail.com</a>.</p>

      <h2 class="mt-10 mb-3 text-[13px] leading-[1.4] font-normal tracking-[0.04em] text-meta uppercase">Accessibility</h2>
      <p class="mb-4">The site uses semantic HTML and works with a keyboard: Tab moves between controls, <kbd>/</kbd> jumps to the search box on the search page, arrow keys step through chart bars, and <kbd>Escape</kbd> closes a chart tooltip. Both themes meet WCAG AA contrast, animation is turned off when your system asks for reduced motion, and every chart has a text or table version.</p>
